<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Freight App MVP</title>

<style>
:root{
  --bg1:#071224;
  --bg2:#0a2a45;
  --card:#0b1a33cc;
  --text:#e9f1ff;
  --muted:#9fb6d7;
  --ok:#9fffb0;
  --err:#ff7b7b;
  --warn:#ffd166;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --r:16px;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:var(--sans);
  color:var(--text);

  background:
    radial-gradient(900px 500px at 20% 30%,rgba(35,110,255,.35),transparent 60%),
    radial-gradient(800px 500px at 75% 70%,rgba(0,255,225,.18),transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));

  padding:28px;
}

.wrap{
  width:100%;
  max-width:1450px;
  margin:0 auto;

  display:flex;
  flex-direction:column;
  gap:20px;
}

.card{
  width:100%;
  background:var(--card);
  border:1px solid rgba(255,255,255,.10);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  backdrop-filter:blur(10px);
}

.login-width{
  max-width:860px;
  margin:0 auto;
}

.head{
  padding:18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  gap:12px;
  align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
}

.dot{
  width:28px;
  height:28px;
  border-radius:10px;
  background:linear-gradient(135deg,#3fbbff,#00ffc4);
  flex:0 0 auto;
}

.title{
  font-weight:900;
  font-size:14px;
}

.sub{
  opacity:.75;
  font-size:12px;
  margin-top:2px;
}

.body{
  padding:18px;
}

h2{
  margin:0 0 12px;
  font-size:14px;
}

label{
  display:block;
  opacity:.75;
  font-size:12px;
  margin:10px 0 6px;
}

input,
select,
textarea{
  width:100%;
  min-height:38px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.07);
  color:var(--text);
  padding:10px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(63,187,255,.70);
  box-shadow:0 0 0 3px rgba(63,187,255,.12);
}

select option{
  color:#111;
  background:#fff;
}

input::placeholder,
textarea::placeholder{
  color:rgba(233,241,255,.45);
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.row4{
  display:grid;
  grid-template-columns:1.5fr .7fr .7fr .7fr;
  gap:10px;
}

.ops-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,520px);
  gap:20px;
  align-items:start;
  width:100%;
  margin-top:16px;
}

.panel{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;

  width:100%;
  max-width:100%;

  position:sticky;
  top:20px;

  overflow:hidden;
}

.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.metric{
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
}

.metric-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.metric-value{
  font-size:16px;
  font-weight:900;
  font-family:var(--mono);
  word-break:break-word;
}

.profit-good{
  color:var(--ok);
}

.profit-bad{
  color:var(--err);
}

.profit-flat{
  color:var(--warn);
}

.btnbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

button{
  cursor:pointer;
  min-height:38px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.09);
  color:var(--text);
  padding:0 14px;
  font-weight:900;
}

button:hover{
  filter:brightness(1.08);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:linear-gradient(180deg,#1f63ff,#0f3db3);
}

.good{
  background:linear-gradient(180deg,#00c896,#008c6e);
}

.warn{
  background:linear-gradient(180deg,#f7b731,#b87900);
  color:#071224;
}

.danger{
  background:linear-gradient(180deg,#ff5f6d,#b30021);
}

.hidden{
  display:none!important;
}

.section{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.08);
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(15,36,70,.8);
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);
  font-size:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:12px;
}

th,
td{
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 8px;
  text-align:left;
  vertical-align:top;
}

th{
  color:var(--muted);
  font-weight:900;
}

tr:hover{
  background:rgba(255,255,255,.03);
  cursor:pointer;
}

.note{
  opacity:.75;
  font-size:12px;
  margin-top:8px;
  line-height:1.45;
}

.invoice-box,
.saved-invoice,
.warning-box,
.doc-preview{
  width:100%;
  max-width:100%;
}

.invoice-box{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  border-radius:14px;
  padding:12px;
  margin-top:10px;
  overflow:auto;
}

.invoice-head{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.invoice-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.invoice-value{
  font-weight:900;
  font-family:var(--mono);
  word-break:break-word;
}

.invoice-total{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,200,150,.08);
  color:var(--ok);
  font-weight:900;
}

.saved-invoice{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(31,99,255,.12);
  font-size:12px;
}

.warning-box{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,209,102,.30);
  background:rgba(255,209,102,.08);
  color:var(--warn);
}

.doc-preview{
  margin-top:10px;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:18px;
  overflow:auto;
}

.build{
  margin-top:12px;
  font-size:11px;
  opacity:.7;
  font-family:var(--mono);
}

@media (max-width:1200px){

  .ops-grid{
    grid-template-columns:1fr;
  }

  .panel{
    position:relative;
    top:auto;
  }
}

@media (max-width:760px){

  body{
    padding:12px;
  }

  .row2,
  .row3,
  .row4,
  .summary-grid,
  .invoice-head{
    grid-template-columns:1fr;
  }

  .ops-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
