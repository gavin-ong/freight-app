<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Freight App MVP</title>

<style>

:root{
  --bg1:#071224;
  --bg2:#0a2a45;
  --card:#0b1a33cc;
  --text:#e9f1ff;
  --muted:#9fb6d7;
  --ok:#9fffb0;
  --err:#ff7b7b;
  --warn:#ffd166;
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --r:16px;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:var(--sans);
  color:var(--text);

  background:
    radial-gradient(900px 500px at 20% 30%,rgba(35,110,255,.35),transparent 60%),
    radial-gradient(800px 500px at 75% 70%,rgba(0,255,225,.18),transparent 55%),
    linear-gradient(180deg,var(--bg1),var(--bg2));

  padding:28px;
}

.wrap{
  width:100%;
  max-width:1450px;
  margin:0 auto;

  display:flex;
  flex-direction:column;
  gap:20px;
}

.card{
  width:100%;
  background:var(--card);
  border:1px solid rgba(255,255,255,.10);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  backdrop-filter:blur(10px);
}

.login-width{
  max-width:860px;
  margin:0 auto;
}

.head{
  padding:18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  gap:12px;
  align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
}

.dot{
  width:28px;
  height:28px;
  border-radius:10px;
  background:linear-gradient(135deg,#3fbbff,#00ffc4);
}

.title{
  font-weight:900;
  font-size:14px;
}

.sub{
  opacity:.75;
  font-size:12px;
  margin-top:2px;
}

.body{
  padding:18px;
}

h2{
  margin:0 0 12px;
  font-size:14px;
}

label{
  display:block;
  opacity:.75;
  font-size:12px;
  margin:10px 0 6px;
}

input,
select,
textarea{
  width:100%;
  min-height:38px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.07);
  color:var(--text);
  padding:10px 12px;
  outline:none;
}

textarea{
  resize:vertical;
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.row4{
  display:grid;
  grid-template-columns:1.4fr .6fr .7fr .7fr;
  gap:10px;
}

.ops-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(420px,520px);
  gap:20px;
  align-items:start;
  width:100%;
}

.panel{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px;

  width:100%;
  max-width:100%;

  position:sticky;
  top:16px;

  overflow:hidden;
}

.section{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.08);
}

.btnbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

button{
  cursor:pointer;
  min-height:36px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.09);
  color:var(--text);
  padding:0 14px;
  font-weight:900;
}

.primary{
  background:linear-gradient(180deg,#1f63ff,#0f3db3);
}

.good{
  background:linear-gradient(180deg,#00c896,#008c6e);
}

.warn{
  background:linear-gradient(180deg,#f7b731,#b87900);
  color:#071224;
}

.danger{
  background:linear-gradient(180deg,#ff5f6d,#b30021);
}

.hidden{
  display:none!important;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:12px;
}

th,
td{
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 8px;
  text-align:left;
}

.note{
  opacity:.75;
  font-size:12px;
  margin-top:8px;
}

.invoice-box{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  border-radius:14px;
  padding:12px;
  margin-top:10px;
  overflow:auto;
}

.doc-preview{
  margin-top:10px;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:18px;
}

.build{
  margin-top:10px;
  font-size:11px;
  opacity:.75;
}

@media (max-width:1200px){

  .ops-grid{
    grid-template-columns:1fr;
  }

  .panel{
    position:relative;
    top:auto;
  }
}

@media (max-width:760px){

  body{
    padding:12px;
  }

  .row2,
  .row3,
  .row4{
    grid-template-columns:1fr;
  }

  .ops-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>
