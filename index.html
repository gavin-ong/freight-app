<!DOCTYPE html>
<html>
<head>
  <title>Freight MVP</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select, button { margin: 5px; padding: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 5px; text-align: left; }
    .section { margin-top: 20px; }
  </style>
</head>

<body>

<h2>Freight Job System</h2>

<!-- JOB SECTION -->
<div class="section">
  <button onclick="createJob()">Create Job</button>
  <select id="jobList" onchange="loadJob()"></select>
</div>

<div class="section">
  <h3>Job Details</h3>
  Customer: <input id="customer"><br>
  Shipper: <input id="shipper"><br>
  Consignee: <input id="consignee"><br>
  Mode: <input id="mode"><br>
  ETA: <input id="eta" type="date"><br>
  ETD: <input id="etd" type="date"><br>

  <button onclick="saveJob()">Save Job</button>
</div>

<!-- CHARGES -->
<div class="section">
  <h3>Charges</h3>
  <button onclick="addCharge()">Add Charge</button>

  <table id="chargesTable">
    <thead>
      <tr>
        <th>Description</th>
        <th>Qty</th>
        <th>Unit Price</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- INVOICE -->
<div class="section">
  <h3>Invoice</h3>

  <button onclick="generateInvoice()">Generate Invoice</button>
  <button onclick="postInvoice()">Post Invoice</button>
  <button onclick="voidInvoice()">Void Invoice</button>

  <table id="invoiceTable">
    <thead>
      <tr>
        <th>Invoice No</th>
        <th>Status</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="app.js"></script>

</body>
</html>
